name: medical-triage-env
description: AI environment for medical triage decision making
version: 1.0

environment:
  entry_point: env.environment:MedicalTriageEnv



observation_space:
  type: object
  properties:
    age:
      type: integer
    symptoms:
      type: array
      items:
        type: string
    heart_rate:
      type: integer
    bp:
      type: string
  required:
    - age
    - symptoms
    - heart_rate
    - bp

action_space:
  type: object
  properties:
    triage_level:
      type: string
      enum: ["low", "medium", "high", "emergency"]
  required:
    - triage_level

reward:
  type: number
  minimum: -1.0
  maximum: 1.0

tasks:
  - name: easy
    description: Basic cold symptoms
    grader:
      type: llm
      prompt_template: |
        You are grading a medical triage agent.
        Based on the actions taken, return a score strictly between 0.1 and 0.9.

        IMPORTANT:
        - Output ONLY a decimal number
        - Do NOT output 0 or 1
        - Do NOT include any text, explanation, or symbols
        - Example valid output: 0.75

  - name: medium
    description: Fever and fatigue
    grader:
      type: llm
      prompt_template: |
        You are grading a medical triage agent.
        Based on the actions taken, return a score strictly between 0.1 and 0.9.

        IMPORTANT:
        - Output ONLY a decimal number
        - Do NOT output 0 or 1
        - Do NOT include any text, explanation, or symbols
        - Example valid output: 0.75

  - name: hard
    description: Critical heart symptoms
    grader:
      type: llm
      prompt_template: |
        You are grading a medical triage agent.
        Based on the actions taken, return a score strictly between 0.1 and 0.9.

        IMPORTANT:
        - Output ONLY a decimal number
        - Do NOT output 0 or 1
        - Do NOT include any text, explanation, or symbols
        - Example valid output: 0.75
