name: medical-triage-env
description: AI environment for medical triage decision making
version: 1.0

environment:
  entry_point: env.environment:MedicalTriageEnv



observation_space:
  type: object
  properties:
    age:
      type: integer
    symptoms:
      type: array
      items:
        type: string
    heart_rate:
      type: integer
    bp:
      type: string
  required:
    - age
    - symptoms
    - heart_rate
    - bp

action_space:
  type: object
  properties:
    triage_level:
      type: string
      enum: ["low", "medium", "high", "emergency"]
  required:
    - triage_level

reward:
  type: number
  minimum: -1.0
  maximum: 1.0

tasks:
  - id: easy_task
    name: easy
    difficulty: easy
    grader: server.graders:EasyGrader

  - id: medium_task
    name: medium
    difficulty: medium
    grader: server.graders:MediumGrader

  - id: hard_task
    name: hard
    difficulty: hard
    grader: server.graders:HardGrader
