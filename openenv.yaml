name: medical-triage-env
description: AI environment for medical triage decision making
version: 1.0

environment:
  entry_point: env.environment:MedicalTriageEnv



observation_space:
  type: object
  properties:
    age:
      type: integer
    symptoms:
      type: array
      items:
        type: string
    heart_rate:
      type: integer
    bp:
      type: string
  required:
    - age
    - symptoms
    - heart_rate
    - bp

action_space:
  type: object
  properties:
    triage_level:
      type: string
      enum: ["low", "medium", "high", "emergency"]
  required:
    - triage_level

reward:
  type: number
  minimum: -1.0
  maximum: 1.0

tasks:
  - id: easy
    difficulty: easy
    grader:
      type: llm
      prompt_template: |
        You are evaluating a medical triage agent.
        Based on the interaction, give a score strictly between 0.1 and 0.9.
        Return ONLY a number.
  - id: medium
    difficulty: medium
    grader:
      type: llm
      prompt_template: |
        You are evaluating a medical triage agent.
        Based on the interaction, give a score strictly between 0.1 and 0.9.
        Return ONLY a number.
  - id: hard
    difficulty: hard
    grader:
      type: llm
      prompt_template: |
        You are evaluating a medical triage agent.
        Based on the interaction, give a score strictly between 0.1 and 0.9.
        Return ONLY a number.
